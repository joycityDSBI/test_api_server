services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLOUD_PROJECT: datahub-478802
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./app/credentials:/app/credentials

  streamlit:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: streamlit-app
    restart: always
    ports:
      - "8501:8501"
    command: python -m streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - app
    volumes:
      - ./app:/app
    environment:
      - API_URL=http://app:8000

  server:
      image: redash/redash:10.1.0.b50633
      command: server
      depends_on:
        - postgres
        - redis
      ports:
        - "5000:5000"
      env_file: .env
      restart: always

  scheduler:
    image: redash/redash:10.1.0.b50633
    command: scheduler
    depends_on:
      - server
    env_file: .env
    restart: always

  scheduled_worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    depends_on:
      - server
    env_file: .env
    restart: always

  adhoc_worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    depends_on:
      - server
    env_file: .env
    restart: always

  # 데이터 저장소 (PostgreSQL)
  postgres:
    image: postgres:12-alpine
    env_file: .env
    environment:
      # 명시적으로 비밀번호를 비워두거나(로그인 허용) 설정합니다.
      - POSTGRES_HOST_AUTH_METHOD=trust 
    volumes:
      # /opt/... 대신 현재 폴더의 하위 폴더를 사용하도록 변경
      - ./postgres-data:/var/lib/postgresql/data
    restart: always

  # 메시지 브로커 및 캐시 (Redis)
  redis:
    image: redis:6-alpine
    restart: always

# Metabase 서비스 추가/수정
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase          # 위에서 생성한 DB 이름
      - MB_DB_PORT=5432
      - MB_DB_USER=postgres              # 기존 DB 사용자명
      - MB_DB_PASS=          # 기존 DB 비밀번호
      - MB_DB_HOST=postgres         # 중요: 기존 DB의 서비스 이름(서비스명으로 통신)
    restart: always
    depends_on:
      - postgres

volumes:
  mysql_data:
